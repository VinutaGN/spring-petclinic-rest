pipeline:
  stages:
    - steps:
        - run:
            script: "echo \"Starting Spring PetClinic CI pipeline\"\r

              java -version\r

              pwd\r

              ls -la\r

              echo \"Checking Maven installation\""
            shell: bash
          name: Build
          id: Build
    - id: javaMavenBuildTestHostedLinuxStage_1
      name: Java Maven Build and Test on Harness Cloud (Linux)
      clone:
        enabled: true
      cache:
        enabled: true
      build-intelligence:
        enabled: true
      steps:
        - id: setupJava
          name: Setup Java
          template:
            uses: setupJava@1.0.0
        - id: buildLinux
          name: Build on Linux
          run:
            shell: bash
            script: "echo \"Starting Spring PetClinic CI pipeline\"\r

              pwd\r

              ls -la\r

              echo \"Checking Java\"\r

              java -version\r

              echo \"Checking Maven\"\r

              mvn -version\r

              echo \"Building application\"\r

              mvn clean package -DskipTests"
        - id: testLinux
          name: Test on Linux
          run-test:
            shell: bash
            script: "echo \"Starting Spring PetClinic tests\"\r

              pwd\r

              ls -la\r

              echo \"Running Maven tests\"\r

              mvn -B test"
            intelligence:
              disabled: true
        - id: coverage
          name: Upload Coverage
          run:
            shell: bash
            script: hcli cov upload
            env:
              CI_ENABLE_HCLI_FOR_TESTS: "true"

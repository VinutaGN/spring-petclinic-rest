pipeline:
  stages:
    - steps:
        - run:
            script: "echo \"Starting Spring PetClinic CI pipeline\"\r

              java -version\r

              pwd\r

              ls -la\r

              echo \"Checking Maven installation\""
            shell: bash
          name: Build
          id: Build
    - id: javaMavenBuildTestHostedLinuxStage_1
      name: Java Maven Build and Test on Harness Cloud (Linux)
      clone:
        enabled: true
      cache:
        enabled: true
      build-intelligence:
        enabled: true
      steps:
        - id: setupJava
          name: Setup Java
          template:
            uses: setupJava@1.0.0
        - id: buildLinux
          name: Build on Linux
          run:
            shell: bash
            script: "echo \"Starting Spring PetClinic CI pipeline\"\r

              \r

              echo \"Current directory:\"\r

              pwd\r

              \r

              echo \"Files in current directory:\"\r

              ls -la\r

              \r

              echo \"Checking Java:\"\r

              java -version\r

              \r

              echo \"Checking Maven Wrapper:\"\r

              if [ -f \"./mvnw\" ]; then\r

              \    echo \"Maven Wrapper found\"\r

              \    chmod +x ./mvnw\r

              \    ./mvnw clean test package\r

              else\r

              \    echo \"Maven Wrapper not found in the current directory\"\r

              \    exit 1\r

              fi"
        - id: testLinux
          name: Test on Linux
          run-test:
            shell: bash
            script: ./mvnw -B test
            intelligence:
              disabled: true
        - id: coverage
          name: Upload Coverage
          run:
            shell: bash
            script: hcli cov upload
            env:
              CI_ENABLE_HCLI_FOR_TESTS: "true"
